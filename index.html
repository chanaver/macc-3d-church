<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Cathedral of St. Joseph — 3D 셋 모델</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#050508;color:#eee;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #c{position:absolute;inset:0}
  #hud{position:absolute;left:0;right:0;bottom:0;background:rgba(8,8,14,.88);border-top:1px solid #2a2a38;padding:10px 16px;backdrop-filter:blur(6px)}
  #hud h1{font-size:14px;font-weight:700}
  #hud p{font-size:12px;color:#9a9ab0;margin-top:2px}
  #ctrl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
  button{background:#1d1d2a;border:1px solid #3a3a4e;color:#eee;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#2b2b3d}
  button.on{background:#3b5bff;border-color:#3b5bff}
  #cueinfo{font-size:12px;color:#ffd76a;margin-left:auto}
  #help{position:absolute;top:10px;left:12px;font-size:11px;color:#777;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:8px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050508;z-index:10;font-size:14px;color:#888}
</style>
<script type="importmap">
{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/"}}
</script>
</head>
<body>
<div id="loading">모델 로딩 중…</div>
<div id="c"></div>
<div id="help">드래그: 회전 · 휠: 줌 · 우드래그: 이동</div>
<div id="hud">
  <h1>Co-Cathedral of St. Joseph — Path of Miracles 셋 3D</h1>
  <p>발다킨 중앙 150" 스크린 + 그린스크린 윙 (실측: 개구부 11.6 × 14.3 ft)</p>
  <div id="ctrl">
    <button id="bLight" class="on">조명: 공연 모드</button>
    <button id="bScreen">스크린: 합성 전</button>
    <button id="bWings">윙: 그린스크린</button>
    <button id="bCue">◀ 큐</button>
    <button id="bCue2">큐 ▶</button>
    <button id="bClose">제단 가까이</button>
    <button id="bNave">객석에서 보기</button>
    <span id="cueinfo"></span>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= renderer / scene ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.Fog(0x050508, 45, 120);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 1.7, 12);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('c').appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.5, -12);
controls.maxPolarAngle = Math.PI*0.55;
controls.minPolarAngle = Math.PI*0.38;
controls.maxDistance = 70;

/* ================= lights (two modes) ================= */
const ambient = new THREE.AmbientLight(0x2a3a66, 0.55); scene.add(ambient);
const blueWash = new THREE.PointLight(0x3a5aff, 260, 95); blueWash.position.set(0, 16, -6); scene.add(blueWash);
const warmSpot = new THREE.SpotLight(0xffb36b, 380, 65, 0.5, 0.6);
warmSpot.position.set(0, 15, -18); warmSpot.target.position.set(0,5,-27.5); scene.add(warmSpot, warmSpot.target);
const housePt = new THREE.PointLight(0xffe0b0, 200, 55); housePt.position.set(0, 9, 8); scene.add(housePt);
const daySun = new THREE.DirectionalLight(0xfff2dd, 0); daySun.position.set(20, 30, 10); scene.add(daySun);
const dayFill = new THREE.HemisphereLight(0xfff6e6, 0x5a4a38, 0); scene.add(dayFill);
let lightMode = 0; // 0 performance, 1 day
function setLight(m){
  lightMode = m;
  const perf = m===0;
  ambient.intensity = perf? 0.55 : 0.9; ambient.color.set(perf?0x2a3a66:0xfff2e0);
  blueWash.intensity = perf? 260 : 0;
  warmSpot.intensity = perf? 380 : 120;
  housePt.intensity = perf? 200 : 600;
  daySun.intensity = perf? 0 : 2.2;
  dayFill.intensity = perf? 0 : 0.9;
  scene.background.set(perf?0x050508:0x1a2030);
  scene.fog.color.set(perf?0x050508:0x1a2030);
  document.getElementById('bLight').textContent = '조명: ' + (perf? '공연 모드':'밝게 (실제)');
  document.getElementById('bLight').classList.toggle('on', perf);
}
document.getElementById('bLight').onclick = ()=> setLight(1-lightMode);

/* ================= procedural textures ================= */
function canvasTex(w,h,draw,rx=1,ry=1){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
// marble floor tiles
const floorTex = canvasTex(512,512,(g)=>{
  g.fillStyle='#3b352e'; g.fillRect(0,0,512,512);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const v=38+Math.random()*14;
    g.fillStyle=`rgb(${v+8},${v+2},${v-4})`;
    g.fillRect(i*128+2,j*128+2,124,124);
    g.strokeStyle='rgba(200,190,170,0.25)';
    for(let k=0;k<6;k++){ g.beginPath(); const x=i*128+Math.random()*128, y=j*128; g.moveTo(x,y); g.lineTo(x+20-Math.random()*40, y+128); g.stroke(); }
  }
},6,16);
// vault: painted panels — cream with blue/gold decoration (from ref photos)
const vaultTex = canvasTex(512,512,(g)=>{
  g.fillStyle='#c9b98f'; g.fillRect(0,0,512,512);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const x=i*128,y=j*128;
    g.fillStyle=(i+j)%2? '#d6c69c':'#c2b088'; g.fillRect(x+6,y+6,116,116);
    g.strokeStyle='#8a6d2a'; g.lineWidth=4; g.strokeRect(x+12,y+12,104,104);
    // blue inset with gold motif
    g.fillStyle='#5a7a9a'; g.fillRect(x+34,y+34,60,60);
    g.strokeStyle='#e8d48a'; g.lineWidth=3; g.strokeRect(x+34,y+34,60,60);
    g.fillStyle='#e8d48a';
    g.beginPath(); g.arc(x+64,y+64,12,0,7); g.fill();
    g.fillStyle='#c9b98f';
    g.beginPath(); g.arc(x+64,y+64,6,0,7); g.fill();
  }
},10,5);
// stained glass (gothic arch window)
function stainedGlassTex(){
  return canvasTex(256,512,(g,w,h)=>{
    g.fillStyle='#101018'; g.fillRect(0,0,w,h);
    const cols=['#c02020','#2040c0','#208020','#c0a020','#8020a0','#20a0c0'];
    // arch top
    g.save();
    g.beginPath(); g.moveTo(20,h-20); g.lineTo(20,140); g.arc(w/2,140,w/2-20,Math.PI,0); g.lineTo(w-20,h-20); g.closePath(); g.clip();
    for(let r=0;r<10;r++)for(let c=0;c<5;c++){
      g.fillStyle=cols[(r*5+c+((r+c)%3))%cols.length];
      g.globalAlpha=0.85;
      g.fillRect(20+c*(w-40)/5, 40+r*(h-60)/10, (w-40)/5-3, (h-60)/10-3);
    }
    g.globalAlpha=1;
    // figure silhouette
    g.fillStyle='rgba(240,230,200,0.9)';
    g.beginPath(); g.arc(w/2,h*0.42,26,0,7); g.fill();
    g.fillRect(w/2-20,h*0.42,40,h*0.34);
    g.restore();
    g.strokeStyle='#3a3226'; g.lineWidth=14; g.strokeRect(8,8,w-16,h-16);
  });
}
const glassTex = stainedGlassTex();

/* ================= materials ================= */
const stoneMat  = new THREE.MeshStandardMaterial({color:0xa89c86, roughness:0.9});
const darkStone = new THREE.MeshStandardMaterial({color:0x4a443c, roughness:0.95});
const marbleGreen = new THREE.MeshStandardMaterial({color:0x3f5f52, roughness:0.3, metalness:0.2});
const whiteMarble = new THREE.MeshStandardMaterial({color:0xe8e2d6, roughness:0.5});
const goldMat   = new THREE.MeshStandardMaterial({color:0xc9a227, roughness:0.35, metalness:0.75});
const woodMat   = new THREE.MeshStandardMaterial({color:0x6b4a2e, roughness:0.65});
const greenMat  = new THREE.MeshStandardMaterial({color:0x00b140, roughness:0.9, side:THREE.DoubleSide});
const floorMat  = new THREE.MeshStandardMaterial({map:floorTex, roughness:0.28, metalness:0.45});
const glassMat  = new THREE.MeshStandardMaterial({map:glassTex, emissive:0xffffff, emissiveMap:glassTex, emissiveIntensity:0.9, roughness:0.4});

/* ================= floor ================= */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24,72), floorMat);
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,-14); floor.receiveShadow=true; scene.add(floor);
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(2.4,46), new THREE.MeshStandardMaterial({color:0x201c18, roughness:0.5}));
aisle.rotation.x=-Math.PI/2; aisle.position.set(0,0.012,-3); scene.add(aisle);

/* ================= pews (with end caps + kneelers) ================= */
{
  const seatG=new THREE.BoxGeometry(7.6,0.12,0.55);
  const backG=new THREE.BoxGeometry(7.6,0.85,0.12);
  const endG=new THREE.BoxGeometry(0.14,1.15,0.7);
  const kneelG=new THREE.BoxGeometry(7.2,0.1,0.35);
  for(let r=0;r<11;r++)for(const sx of [-1,1]){
    const z=7-r*2.15, x=sx*5.0;
    const grp=new THREE.Group();
    const seat=new THREE.Mesh(seatG,woodMat); seat.position.y=0.48; grp.add(seat);
    const back=new THREE.Mesh(backG,woodMat); back.position.set(0,0.95,-0.3); grp.add(back);
    const top=new THREE.Mesh(new THREE.BoxGeometry(7.6,0.09,0.2),woodMat); top.position.set(0,1.4,-0.3); grp.add(top);
    for(const ex of [-3.8,3.8]){ const e=new THREE.Mesh(endG,woodMat); e.position.set(ex,0.58,0); grp.add(e); }
    const kn=new THREE.Mesh(kneelG,woodMat); kn.position.set(0,0.12,0.55); grp.add(kn);
    grp.position.set(x,0,z);
    grp.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    scene.add(grp);
  }
}

/* ================= columns (green marble, gold capitals) ================= */
const colX=7.5;
{
  const shaftG=new THREE.CylinderGeometry(0.5,0.62,12.5,14);
  // fluting illusion: darker vertical stripes via texture
  const fluteTex=canvasTex(128,32,(g,w,h)=>{ g.fillStyle='#3f5f52'; g.fillRect(0,0,w,h); g.fillStyle='rgba(0,0,0,0.25)'; for(let i=0;i<16;i++) g.fillRect(i*8,0,3,h); },3,1);
  const shaftMat=new THREE.MeshStandardMaterial({map:fluteTex, roughness:0.3, metalness:0.2});
  for(let i=0;i<5;i++)for(const sx of [-1,1]){
    const z=4-i*6.5;
    const grp=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.9,1.7),darkStone); base.position.y=0.45; grp.add(base);
    const shaft=new THREE.Mesh(shaftG,shaftMat); shaft.position.y=0.9+6.25; shaft.castShadow=true; grp.add(shaft);
    // layered capital: abacus + echinus + necking
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.55,0.4,14),goldMat); neck.position.y=13.5; grp.add(neck);
    const ech=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.62,0.55,14),goldMat); ech.position.y=13.95; grp.add(ech);
    const abac=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.35,1.7),goldMat); abac.position.y=14.4; grp.add(abac);
    grp.position.set(sx*colX,0,z);
    scene.add(grp);
  }
  // chandeliers
  const lampMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.6});
  const glowMat=new THREE.MeshBasicMaterial({color:0xffe2a8});
  for(let i=0;i<4;i++)for(const sx of [-1,1]){
    const z=0.75-i*6.5, x=sx*5.8;
    const cord=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.4),lampMat); cord.position.set(x,14.6,z); scene.add(cord);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.65,0.09,8,16),lampMat); ring.rotation.x=Math.PI/2; ring.position.set(x,12.9,z); scene.add(ring);
    for(let k=0;k<6;k++){
      const a=k/6*Math.PI*2;
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),glowMat);
      bulb.position.set(x+Math.cos(a)*0.65,12.72,z+Math.sin(a)*0.65); scene.add(bulb);
    }
  }
}

/* ================= walls with pilasters, arches, windows, art ================= */
const wallH=17;
for(const sx of [-1,1]){
  const wall=new THREE.Mesh(new THREE.BoxGeometry(1.4,wallH,64),stoneMat);
  wall.position.set(sx*11,wallH/2,-14); wall.receiveShadow=true; scene.add(wall);
  const inner=sx*10.3;
  // pilasters between arches
  for(let i=0;i<6;i++){
    const z=7.25-i*6.5;
    const pil=new THREE.Mesh(new THREE.BoxGeometry(0.5,15,1.1),stoneMat);
    pil.position.set(sx*10.5,7.5,z); scene.add(pil);
    const pcap=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,1.3),darkStone);
    pcap.position.set(sx*10.5,14.2,z); scene.add(pcap);
  }
  // arch moldings
  for(let i=0;i<5;i++){
    const z=4-i*6.5;
    const arch=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.32,8,24,Math.PI),darkStone);
    arch.position.set(sx*10.2,13.4,z); arch.rotation.y=Math.PI/2; scene.add(arch);
  }
  // clerestory stained-glass windows (upper)
  for(let i=0;i<5;i++){
    const z=4-i*6.5;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.7,3.6),glassMat);
    win.position.set(inner-0.05*sx,12.6,z); win.rotation.y=-sx*Math.PI/2; scene.add(win);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(0.25,4.0,2.1),darkStone);
    frame.position.set(sx*10.35,12.6,z); scene.add(frame);
  }
  // aisle tall windows (lower, between arches)
  for(let i=0;i<4;i++){
    const z=0.75-i*6.5;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.5,4.6),glassMat);
    win.position.set(inner-0.05*sx,6.4,z); win.rotation.y=-sx*Math.PI/2; scene.add(win);
  }
  // gold-framed paintings (stations) on wall piers
  for(let i=0;i<4;i++){
    const z=0.75-i*6.5;
    const fr=new THREE.Mesh(new THREE.BoxGeometry(0.18,2.2,1.5),goldMat);
    fr.position.set(sx*10.3,6.8,z+3.25); scene.add(fr);
    const cv2=new THREE.Mesh(new THREE.PlaneGeometry(1.3,2.0),new THREE.MeshStandardMaterial({color:0x2a2030,roughness:0.9}));
    cv2.position.set(sx*10.2,6.8,z+3.25); cv2.rotation.y=-sx*Math.PI/2; scene.add(cv2);
  }
}
// back wall + organ loft
{
  const bw=new THREE.Mesh(new THREE.BoxGeometry(24,wallH,1.4),stoneMat);
  bw.position.set(0,wallH/2,18); scene.add(bw);
  const loft=new THREE.Mesh(new THREE.BoxGeometry(16,0.8,4),darkStone);
  loft.position.set(0,9,15.6); scene.add(loft);
  const rail=new THREE.Mesh(new THREE.BoxGeometry(16,1.0,0.15),woodMat);
  rail.position.set(0,9.9,13.7); scene.add(rail);
  // rose window
  const rose=new THREE.Mesh(new THREE.CircleGeometry(2.2,24),glassMat);
  rose.position.set(0,13.5,17.28); rose.rotation.y=Math.PI; scene.add(rose);
  // organ pipes (from ref: visible above loft)
  {
    const pipeMat=new THREE.MeshStandardMaterial({color:0xb8b0a0,roughness:0.35,metalness:0.7});
    for(let i=0;i<9;i++){
      const h=2.2+Math.sin(i/8*Math.PI)*1.6;
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,h,8),pipeMat);
      p.position.set(-3.2+i*0.8, 10.2+h/2, 16.9); scene.add(p);
    }
    const case1=new THREE.Mesh(new THREE.BoxGeometry(8.4,3.4,0.7),woodMat);
    case1.position.set(0,10.6,17.15); scene.add(case1);
  }
  // main entrance doors (dark wood, under loft)
  {
    const doorMat=new THREE.MeshStandardMaterial({color:0x3a2415,roughness:0.7});
    for(const sx of [-1.6,0,1.6]){
      const door=new THREE.Mesh(new THREE.BoxGeometry(2.6,4.6,0.3),doorMat);
      door.position.set(sx*2.0,2.3,17.25); scene.add(door);
      const dframe=new THREE.Mesh(new THREE.BoxGeometry(3.0,5.0,0.2),darkStone);
      dframe.position.set(sx*2.0,2.5,17.32); scene.add(dframe);
      door.position.z=17.2;
    }
  }
}

/* ================= vaulted ceiling ================= */
{
  const geo=new THREE.CylinderGeometry(11,11,64,28,1,true,-Math.PI/2,Math.PI);
  const mat=new THREE.MeshStandardMaterial({map:vaultTex,side:THREE.BackSide,roughness:0.85});
  const vault=new THREE.Mesh(geo,mat);
  vault.rotation.x=-Math.PI/2;
  vault.position.set(0,14,-14); scene.add(vault);
  // transverse ribs
  for(let i=0;i<6;i++){
    const rib=new THREE.Mesh(new THREE.TorusGeometry(11,0.22,8,28,Math.PI),darkStone);
    rib.position.set(0,14,7-i*10.5); rib.rotation.y=Math.PI/2; scene.add(rib);
  }
}

/* ================= sanctuary ================= */
const plat=new THREE.Mesh(new THREE.BoxGeometry(21,1.0,11),darkStone);
plat.position.set(0,0.5,-27.5); plat.receiveShadow=true; scene.add(plat);
for(let s=0;s<3;s++){
  const step=new THREE.Mesh(new THREE.BoxGeometry(9-s*1.6,0.33,1.3),stoneMat);
  step.position.set(0,0.16+s*0.33,-21.4+s*1.15); scene.add(step);
}
// communion rail (white balustrade)
{
  const railMat=whiteMarble;
  const top=new THREE.Mesh(new THREE.BoxGeometry(16,0.14,0.5),railMat);
  top.position.set(0,2.05,-22.2); top.castShadow=true; scene.add(top);
  for(let i=0;i<=16;i++){
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,0.95,6),railMat);
    b.position.set(-8+i,1.5,-22.2); scene.add(b);
  }
  const baseR=new THREE.Mesh(new THREE.BoxGeometry(16,0.18,0.4),railMat);
  baseR.position.set(0,1.05,-22.2); scene.add(baseR);
}

/* ================= baldachin (white marble) ================= */
const bald=new THREE.Group();
{
  const cGeo=new THREE.CylinderGeometry(0.26,0.33,6.6,12);
  for(const [bx,bz] of [[-2.1,-29.1],[2.1,-29.1],[-2.1,-25.9],[2.1,-25.9]]){
    const c=new THREE.Mesh(cGeo,whiteMarble); c.position.set(bx,1+3.3,bz); c.castShadow=true; bald.add(c);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.55,0.95),whiteMarble); cb.position.set(bx,1.28,bz); bald.add(cb);
    const cc=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.8),goldMat); cc.position.set(bx,1+6.6+0.2,bz); bald.add(cc);
  }
  const ent=new THREE.Mesh(new THREE.BoxGeometry(5.7,1.0,4.5),whiteMarble);
  ent.position.set(0,1+6.6+0.5,-27.5); ent.castShadow=true; bald.add(ent);
  const trim=new THREE.Mesh(new THREE.BoxGeometry(5.9,0.22,4.7),goldMat);
  trim.position.set(0,1+6.6+1.05,-27.5); bald.add(trim);
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(0.02,3.15,1.7,4,1),whiteMarble);
  ped.rotation.y=Math.PI/4; ped.scale.set(1,1,0.8); ped.position.set(0,1+6.6+1.0+0.85,-27.5); bald.add(ped);
  for(const sx of [-1.95,1.95]){
    // angel: robed figure, wings raised upward (stylized, from ref photos)
    const ag=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.2,0.85,4,8),whiteMarble);
    body.position.y=0.62; ag.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,8),whiteMarble);
    head.position.y=1.35; ag.add(head);
    for(const wx of [-1,1]){
      const wing=new THREE.Mesh(new THREE.PlaneGeometry(0.55,1.15),new THREE.MeshStandardMaterial({color:0xe8e2d6,roughness:0.6,side:THREE.DoubleSide}));
      wing.position.set(wx*0.32,1.35,0);
      wing.rotation.z=wx*-0.35;
      wing.rotation.x=-0.15;
      ag.add(wing);
    }
    ag.position.set(sx,1+6.6+1.0+1.7,-27.5);
    ag.rotation.y=-sx*0.3;
    bald.add(ag);
  }
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.62,1.3,8),whiteMarble);

/* ================= wings: draped green fabric ================= */
function makeWing(sx){
  // real wings: 35 ft (10.7m) wide x 9ft 3in (2.8m) tall — long horizontal swag
  const geo=new THREE.PlaneGeometry(10.6,2.9,36,10);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    const u=(x+5.3)/10.6;   // 0..1 across plane
    // o: 0=inner(near baldachin), 1=outer(near wall)
    const o = sx<0 ? 1-u : u;
    // swag: outer end high, dips in middle, inner end low
    const hang = o*2.4 - Math.sin(o*Math.PI)*1.0;
    // fabric folds
    const folds=Math.sin(u*14.0)*0.18+Math.sin(u*31.0)*0.07;
    const v=(y+1.45)/2.9;   // 0=bottom, 1=top
    pos.setY(i, y + hang*(0.35+0.65*v) - (1-v)*0.4);
    pos.setZ(i, folds + Math.sin(o*Math.PI)*0.45);
  }
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,greenMat);
  // spans from near baldachin (x~2.6) out to side wall (x~13.2)
  m.position.set(sx*6.6,5.6,-26.3);
  m.rotation.y=sx*-0.10;
  m.castShadow=true;
  scene.add(m); return m;
}

  'cues/000.webp',
  'cues/018.webp',
  'cues/034.webp',

  'cues/052.webp',
];
const CUE_NAMES=['Roncesvalles 01분','Roncesvalles 18분','Burgos 16분','León 05분','Santiago 05분'];
let cueIdx=0, screenMode=0;
function setCue(i){
  cueIdx=(i+CUE_URLS.length)%CUE_URLS.length;
  texLoader.load(CUE_URLS[cueIdx],t=>{ t.colorSpace=THREE.SRGBColorSpace; screenMat.map=t; screenMat.color.set(0xffffff); screenMat.needsUpdate=true; });
  document.getElementById('cueinfo').textContent='큐: '+CUE_NAMES[cueIdx];
}
document.getElementById('bScreen').onclick=e=>{
  screenMode=(screenMode+1)%2;
  e.target.textContent='스크린: '+(screenMode?'투사 중':'합성 전');
  e.target.classList.toggle('on',!!screenMode);
  if(screenMode) setCue(cueIdx);
  else { screenMat.map=null; screenMat.color.set(0x141414); screenMat.needsUpdate=true; document.getElementById('cueinfo').textContent=''; }
};
let wingMode=0;

};
document.getElementById('bCue').onclick=()=>{ if(screenMode) setCue(cueIdx-1); };

document.getElementById('bClose').onclick=()=>{ camera.position.set(0,1.8,-16); controls.target.set(0,5,-27); };

controls.minDistance=2.5; controls.maxDistance=32;
