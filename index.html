<!DOCTYPE html>

  <p>그린스크린 윙 (실측: 개구부 11.6 × 14.3 ft, 윙 35 × 9.3 ft)</p>
  <div id="ctrl">

    <input type="file" id="wingFile" accept="image/*" style="display:none">
    <!-- <button id="bCue">◀ 큐</button> -->
    <!-- <button id="bCue2">큐 ▶</button> -->

    <button id="bNave">객석에서 보기</button>
    <span id="cueinfo"></span>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= renderer / scene ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.Fog(0x050508, 45, 120);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 2.2, 8);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('c').appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, -12);
controls.maxPolarAngle = Math.PI*0.55;
controls.minPolarAngle = Math.PI*0.38;
controls.maxDistance = 70;

/* ================= lights (two modes) ================= */
// performance: dark church, SET is lit (wings pop, baldachin warm)
const ambient = new THREE.AmbientLight(0x2a3a66, 0.55); scene.add(ambient);
const blueWash = new THREE.PointLight(0x3a5aff, 260, 95); blueWash.position.set(0, 16, -6); scene.add(blueWash);
// wing wash lights — make the green wings POP like in the set photo
const wingLightL = new THREE.SpotLight(0xd0ffe0, 500, 30, 0.6, 0.4);
wingLightL.position.set(-7, 10, -20); wingLightL.target.position.set(-6, 5.5, -26.5);
scene.add(wingLightL, wingLightL.target);
const wingLightR = new THREE.SpotLight(0xd0ffe0, 500, 30, 0.6, 0.4);
wingLightR.position.set(7, 10, -20); wingLightR.target.position.set(6, 5.5, -26.5);
scene.add(wingLightR, wingLightR.target);
// baldachin warm spotlight
const warmSpot = new THREE.SpotLight(0xff8a4a, 380, 65, 0.5, 0.6);
warmSpot.position.set(0, 15, -18); warmSpot.target.position.set(0,5,-27.5); scene.add(warmSpot, warmSpot.target);
const housePt = new THREE.PointLight(0xffe0b0, 200, 55); housePt.position.set(0, 9, 8); scene.add(housePt);
const daySun = new THREE.DirectionalLight(0xfff2dd, 0); daySun.position.set(20, 30, 10); scene.add(daySun);
const dayFill = new THREE.HemisphereLight(0xfff6e6, 0x5a4a38, 0); scene.add(dayFill);
// dome material ref for dimming in performance mode
let domeMat = null;
let lightMode = 0; // 0 performance, 1 day
function setLight(m){
  lightMode = m;
  const perf = m===0;
  ambient.intensity = perf? 0.12 : 0.9; ambient.color.set(perf?0x0a1020:0xfff2e0);
  blueWash.intensity = perf? 60 : 0;
  wingLightL.intensity = perf? 1200 : 0;
  wingLightR.intensity = perf? 1200 : 0;
  warmSpot.intensity = perf? 700 : 120;
  housePt.intensity = perf? 30 : 600;
  daySun.intensity = perf? 0 : 2.2;
  dayFill.intensity = perf? 0 : 0.9;
  if(domeMat) domeMat.color.set(perf? 0x2a2a2a : 0xffffff);
  scene.background.set(perf?0x030308:0x1a2030);
  scene.fog.color.set(perf?0x030308:0x1a2030);
  document.getElementById('bLight').textContent = '조명: ' + (perf? '공연 모드':'밝게 (실제)');
  document.getElementById('bLight').classList.toggle('on', perf);
}
document.getElementById('bLight').onclick = ()=> setLight(1-lightMode);

/* ================= procedural textures ================= */
function canvasTex(w,h,draw,rx=1,ry=1){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
// marble floor tiles
const floorTex = canvasTex(512,512,(g)=>{
  g.fillStyle='#3b352e'; g.fillRect(0,0,512,512);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const v=38+Math.random()*14;
    g.fillStyle=`rgb(${v+8},${v+2},${v-4})`;
    g.fillRect(i*128+2,j*128+2,124,124);
    g.strokeStyle='rgba(200,190,170,0.25)';
    for(let k=0;k<6;k++){ g.beginPath(); const x=i*128+Math.random()*128, y=j*128; g.moveTo(x,y); g.lineTo(x+20-Math.random()*40, y+128); g.stroke(); }
  }
},6,16);
// vault: ornate painted coffers — gold borders, rosettes, blue monogram panels (from detail-1.jpg)
const vaultTex = canvasTex(512,512,(g)=>{
  g.fillStyle='#c8b586'; g.fillRect(0,0,512,512);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const x=i*128,y=j*128;
    // coffer base
    g.fillStyle=(i+j)%2? '#d6c498':'#c2b088'; g.fillRect(x+3,y+3,122,122);
    // triple gold border
    g.strokeStyle='#8a6d2a'; g.lineWidth=3; g.strokeRect(x+8,y+8,112,112);
    g.strokeStyle='#d4af37'; g.lineWidth=1.5; g.strokeRect(x+14,y+14,100,100);
    g.strokeStyle='#8a6d2a'; g.lineWidth=1; g.strokeRect(x+20,y+20,88,88);
    if((i+j)%2===0){
      // rosette: gold flower on cream
      g.fillStyle='#a8842e';
      for(let k=0;k<8;k++){ const a=k/8*Math.PI*2;
        g.beginPath(); g.ellipse(x+64+Math.cos(a)*18,y+64+Math.sin(a)*18,10,5,a,0,7); g.fill(); }
      g.fillStyle='#d4af37'; g.beginPath(); g.arc(x+64,y+64,12,0,7); g.fill();
      g.fillStyle='#7a5c1e'; g.beginPath(); g.arc(x+64,y+64,6,0,7); g.fill();
    } else {
      // blue monogram panel
      g.fillStyle='#4a6a9a'; g.fillRect(x+34,y+34,60,60);
      g.strokeStyle='#e8d48a'; g.lineWidth=2.5; g.strokeRect(x+34,y+34,60,60);
      g.fillStyle='#e8d48a'; g.font='bold 28px serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(['IHS','AM','JR','SP'][ (i*4+j)%4 ], x+64, y+66);
    }
    // corner dots
    g.fillStyle='#8a6d2a';
    for(const [cx,cy] of [[x+28,y+28],[x+100,y+28],[x+28,y+100],[x+100,y+100]]){
      g.beginPath(); g.arc(cx,cy,4,0,7); g.fill();
    }
  }
},10,5);
// stained glass (gothic arch window)
function stainedGlassTex(){
  return canvasTex(256,512,(g,w,h)=>{
    g.fillStyle='#101018'; g.fillRect(0,0,w,h);
    const cols=['#c02020','#2040c0','#208020','#c0a020','#8020a0','#20a0c0'];
    // arch top
    g.save();
    g.beginPath(); g.moveTo(20,h-20); g.lineTo(20,140); g.arc(w/2,140,w/2-20,Math.PI,0); g.lineTo(w-20,h-20); g.closePath(); g.clip();
    for(let r=0;r<10;r++)for(let c=0;c<5;c++){
      g.fillStyle=cols[(r*5+c+((r+c)%3))%cols.length];
      g.globalAlpha=0.85;
      g.fillRect(20+c*(w-40)/5, 40+r*(h-60)/10, (w-40)/5-3, (h-60)/10-3);
    }
    g.globalAlpha=1;
    // figure silhouette
    g.fillStyle='rgba(240,230,200,0.9)';
    g.beginPath(); g.arc(w/2,h*0.42,26,0,7); g.fill();
    g.fillRect(w/2-20,h*0.42,40,h*0.34);
    g.restore();
    g.strokeStyle='#3a3226'; g.lineWidth=14; g.strokeRect(8,8,w-16,h-16);
  });
}
const glassTex = stainedGlassTex();

/* ================= materials ================= */
const stoneMat  = new THREE.MeshStandardMaterial({color:0xa89c86, roughness:0.9});
const darkStone = new THREE.MeshStandardMaterial({color:0x4a443c, roughness:0.95});
const marbleGreen = new THREE.MeshStandardMaterial({color:0x3f5f52, roughness:0.3, metalness:0.2});
const whiteMarble = new THREE.MeshStandardMaterial({color:0xe8e2d6, roughness:0.5});
const goldMat   = new THREE.MeshStandardMaterial({color:0xc9a227, roughness:0.35, metalness:0.75});
const woodMat   = new THREE.MeshStandardMaterial({color:0x6b4a2e, roughness:0.65});
const greenMat  = new THREE.MeshStandardMaterial({color:0x00c850, roughness:0.85, side:THREE.DoubleSide, emissive:0x004a1a, emissiveIntensity:0.7});
let wingTexMode = 0;
const wingTexLoader = new THREE.TextureLoader();
const floorMat  = new THREE.MeshStandardMaterial({map:floorTex, roughness:0.28, metalness:0.45});
const glassMat  = new THREE.MeshStandardMaterial({map:glassTex, emissive:0xffffff, emissiveMap:glassTex, emissiveIntensity:0.9, roughness:0.4});

/* ================= floor ================= */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24,72), floorMat);
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,-14); floor.receiveShadow=true; scene.add(floor);
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(2.4,46), new THREE.MeshStandardMaterial({color:0x201c18, roughness:0.5}));
aisle.rotation.x=-Math.PI/2; aisle.position.set(0,0.012,-3); scene.add(aisle);

/* ================= pews (with end caps + kneelers) ================= */
{
  // pews span wall-to-wall (like the real church), columns stand among them
  // split each bank to leave a gap at column line (x=±7.5)
  const endG=new THREE.BoxGeometry(0.14,1.15,0.65);
  for(let r=0;r<24;r++)for(const sx of [-1,1]){
    const z=9-r*0.98;
    for(const seg of [[1.15,5.9],[8.1,9.9]]){
      const wdt=seg[1]-seg[0], cx=sx*(seg[0]+seg[1])/2;
      const grp=new THREE.Group();
      const seat=new THREE.Mesh(new THREE.BoxGeometry(wdt,0.12,0.5),woodMat); seat.position.y=0.48; grp.add(seat);
      const back=new THREE.Mesh(new THREE.BoxGeometry(wdt,0.85,0.12),woodMat); back.position.set(0,0.95,-0.3); grp.add(back);
      const top=new THREE.Mesh(new THREE.BoxGeometry(wdt,0.09,0.2),woodMat); top.position.set(0,1.4,-0.28); grp.add(top);
      for(const ex of [-wdt/2,wdt/2]){ const e=new THREE.Mesh(endG,woodMat); e.position.set(ex,0.58,0); grp.add(e); }
      const kn=new THREE.Mesh(new THREE.BoxGeometry(wdt-0.4,0.1,0.32),woodMat); kn.position.set(0,0.12,0.55); grp.add(kn);
      grp.position.set(cx,0,z);
      grp.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
      scene.add(grp);
    }
  }
}

/* ================= columns (green marble, gold capitals) ================= */
const colX=7.5;
{
  const shaftG=new THREE.CylinderGeometry(0.36,0.46,9.0,14);
  // fluting illusion: darker vertical stripes via texture
  const fluteTex=canvasTex(128,32,(g,w,h)=>{ g.fillStyle='#3f5f52'; g.fillRect(0,0,w,h); g.fillStyle='rgba(0,0,0,0.25)'; for(let i=0;i<16;i++) g.fillRect(i*8,0,3,h); },3,1);
  const shaftMat=new THREE.MeshStandardMaterial({map:fluteTex, roughness:0.3, metalness:0.2});
  for(let i=0;i<5;i++)for(const sx of [-1,1]){
    const z=4-i*6.5;
    const grp=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.25,0.9,1.25),darkStone); base.position.y=0.45; grp.add(base);
    const shaft=new THREE.Mesh(shaftG,shaftMat); shaft.position.y=0.9+4.5; shaft.castShadow=true; grp.add(shaft);
    // layered capital: abacus + echinus + necking
    // ornate Corinthian capital (from detail-1.jpg ref) — capital top at ~11m
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.4,0.4,14),goldMat); neck.position.y=10.1; grp.add(neck);
    const ech=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.46,0.55,14),goldMat); ech.position.y=10.55; grp.add(ech);
    // acanthus leaf hints: angled boxes around echinus
    for(let k=0;k<8;k++){
      const a=k/8*Math.PI*2;
      const leaf=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.5,0.1),goldMat);
      leaf.position.set(Math.cos(a)*0.62,10.55,Math.sin(a)*0.62);
      leaf.rotation.y=-a; leaf.rotation.x=0.35;
      grp.add(leaf);
    }
    // volutes at corners
    for(const [vx,vz] of [[0.55,0.55],[-0.55,0.55],[0.55,-0.55],[-0.55,-0.55]]){
      const vol=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8),goldMat);
      vol.position.set(vx,10.85,vz); grp.add(vol);
    }
    const abac=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.3,1.35),goldMat); abac.position.y=11.05; grp.add(abac);
    grp.position.set(sx*colX,0,z);
    scene.add(grp);
  }
  // chandeliers: hanging lanterns (from ref photos)
  const lampMat2=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.5,metalness:0.6});
  const glowMat=new THREE.MeshBasicMaterial({color:0xffe2a8});
  const glassLantern=new THREE.MeshStandardMaterial({color:0xfff2cc,roughness:0.3,transparent:true,opacity:0.85,emissive:0xffd88a,emissiveIntensity:0.55});
  for(let i=0;i<4;i++)for(const sx of [-1,1]){
    const z=0.75-i*6.5, x=sx*5.8;
    const chand=new THREE.Group();
    const chain=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,2.6),lampMat2);
    chain.position.y=1.9; chand.add(chain);
    const crown=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.07,8,18),lampMat2);
    crown.rotation.x=Math.PI/2; crown.position.y=0.6; chand.add(crown);
    const lantern=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.42,0.85,10),glassLantern);
    lantern.position.y=0.1; chand.add(lantern);
    const capT=new THREE.Mesh(new THREE.ConeGeometry(0.45,0.35,10),lampMat2);
    capT.position.y=0.7; chand.add(capT);
    const capB=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.3,0.25,10),lampMat2);
    capB.position.y=-0.45; chand.add(capB);
    for(let k=0;k<8;k++){
      const a=k/8*Math.PI*2;
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),glowMat);
      bulb.position.set(Math.cos(a)*0.55,0.55,Math.sin(a)*0.55); chand.add(bulb);
    }
    chand.position.set(x,9.0,z);
    scene.add(chand);
  }
}

/* ================= walls with pilasters, arches, windows, art ================= */
const wallH=12;
for(const sx of [-1,1]){
  const wall=new THREE.Mesh(new THREE.BoxGeometry(1.4,wallH,64),stoneMat);
  wall.position.set(sx*11,wallH/2,-14); wall.receiveShadow=true; scene.add(wall);
  const inner=sx*10.3;
  // pilasters between arches
  for(let i=0;i<6;i++){
    const z=7.25-i*6.5;
    const pil=new THREE.Mesh(new THREE.BoxGeometry(0.5,15,1.1),stoneMat);
    pil.position.set(sx*10.5,7.5,z); scene.add(pil);
    const pcap=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,1.3),darkStone);
    pcap.position.set(sx*10.5,14.2,z); scene.add(pcap);
  }
  // arch moldings
  for(let i=0;i<5;i++){
    const z=4-i*6.5;
    const arch=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.32,8,24,Math.PI),darkStone);
    arch.position.set(sx*10.2,10.2,z); arch.rotation.y=Math.PI/2; scene.add(arch);
  }
  // clerestory stained-glass windows (upper)
  for(let i=0;i<5;i++){
    const z=4-i*6.5;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.7,3.6),glassMat);
    win.position.set(inner-0.05*sx,12.6,z); win.rotation.y=-sx*Math.PI/2; scene.add(win);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(0.25,4.0,2.1),darkStone);
    frame.position.set(sx*10.35,12.6,z); scene.add(frame);
  }
  // aisle tall windows (lower, between arches)
  for(let i=0;i<4;i++){
    const z=0.75-i*6.5;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.5,4.6),glassMat);
    win.position.set(inner-0.05*sx,6.4,z); win.rotation.y=-sx*Math.PI/2; scene.add(win);
  }
  // gold-framed paintings (stations) on wall piers
  for(let i=0;i<4;i++){
    const z=0.75-i*6.5;
    const fr=new THREE.Mesh(new THREE.BoxGeometry(0.18,2.2,1.5),goldMat);
    fr.position.set(sx*10.3,6.8,z+3.25); scene.add(fr);
    const cv2=new THREE.Mesh(new THREE.PlaneGeometry(1.3,2.0),new THREE.MeshStandardMaterial({color:0x2a2030,roughness:0.9}));
    cv2.position.set(sx*10.2,6.8,z+3.25); cv2.rotation.y=-sx*Math.PI/2; scene.add(cv2);
  }
}
// back wall + organ loft
{
  const bw=new THREE.Mesh(new THREE.BoxGeometry(24,wallH,1.4),stoneMat);
  bw.position.set(0,wallH/2,18); scene.add(bw);
  const loft=new THREE.Mesh(new THREE.BoxGeometry(16,0.8,4),darkStone);
  loft.position.set(0,9,15.6); scene.add(loft);
  const rail=new THREE.Mesh(new THREE.BoxGeometry(16,1.0,0.15),woodMat);
  rail.position.set(0,9.9,13.7); scene.add(rail);
  // rose window
  const rose=new THREE.Mesh(new THREE.CircleGeometry(2.2,24),glassMat);
  rose.position.set(0,13.5,17.28); rose.rotation.y=Math.PI; scene.add(rose);
  // organ pipes (from ref: visible above loft)
  {
    const pipeMat=new THREE.MeshStandardMaterial({color:0xb8b0a0,roughness:0.35,metalness:0.7});
    for(let i=0;i<9;i++){
      const h=2.2+Math.sin(i/8*Math.PI)*1.6;
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,h,8),pipeMat);
      p.position.set(-3.2+i*0.8, 10.2+h/2, 16.9); scene.add(p);
    }
    const case1=new THREE.Mesh(new THREE.BoxGeometry(8.4,3.4,0.7),woodMat);
    case1.position.set(0,10.6,17.15); scene.add(case1);
  }
  // main entrance doors (dark wood, under loft)
  {
    const doorMat=new THREE.MeshStandardMaterial({color:0x3a2415,roughness:0.7});
    for(const sx of [-1.6,0,1.6]){
      const door=new THREE.Mesh(new THREE.BoxGeometry(2.6,4.6,0.3),doorMat);
      door.position.set(sx*2.0,2.3,17.25); scene.add(door);
      const dframe=new THREE.Mesh(new THREE.BoxGeometry(3.0,5.0,0.2),darkStone);
      dframe.position.set(sx*2.0,2.5,17.32); scene.add(dframe);
      door.position.z=17.2;
    }
  }
}

/* ================= vaulted ceiling ================= */
{
  const geo=new THREE.CylinderGeometry(7.5,7.5,64,28,1,true,-Math.PI/2,Math.PI);

/* ================= wings: draped green fabric (from user set photo) ================= */
// No center screen — wings only. Real wings: 35ft x 9ft3in each.
// Hung from batten at y=7.0, inner end (near baldachin) drapes lower.
function makeWing(sx){
  // Photo analysis: 7m span, top at y=9.0, middle drapes to y=5.0 (4m drop)
  // Fabric 10.67m gathered into 7m span = deep swag. 2.82m fabric height.
  const SPAN=7.0, SEG=48, VSEG=20;
  const geo=new THREE.PlaneGeometry(SPAN,3.4,SEG,VSEG);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    const u=(x+SPAN/2)/SPAN;   // 0=inner(baldachin), 1=outer(side)
    const v=(y+1.7)/3.4;       // 0=bottom, 1=top
    // catenary top edge: 9.0 at ends, 6.2 in middle
    const cat = Math.cosh((u-0.5)*2.8)/Math.cosh(1.4);
    const topY = 7.5 - (1-cat)*2.2;
    // bottom edge: fabric 2.82m tall, hangs below top
    const botY = topY - 2.82*(0.85+0.15*cat);
    const yy = botY + v*(topY-botY);
    // natural gathered folds
    const folds = (Math.sin(u*29.0+1.3)*0.3 + Math.sin(u*53.0+0.7)*0.14 + Math.sin(u*13.0+2.9)*0.2)
                  * (1-v*0.55);
    const billow = Math.sin(u*Math.PI)*0.8*(1-v*0.6);
    pos.setY(i, yy);
    pos.setZ(i, folds + billow);
  }
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo, greenMat);
  // inner end near baldachin (x=±2.6), outer end toward side (x=±9.6)
  m.position.set(sx*(2.6+SPAN/2), 0, -26.5);
  m.castShadow=true;
  scene.add(m); return m;
}
